version: '3.8'

# ==============================================================================
# knowledge-opc 生产环境 Docker Compose 编排
# 统一规范：
#   服务名 (Service):   knowledge-opc-xxx
#   容器名 (Container): knowledge-opc-xxx
#   镜像名 (Image):     knowledge-opc-xxx:${KNOWLEDGE_OPC_VERSION:-latest}
#   网络名 (Network):   knowledge-opc-network
# ==============================================================================

networks:
  knowledge-opc-network:
    name: knowledge-opc-network
    driver: bridge

volumes:
  knowledge-opc-postgres-data:
    name: knowledge-opc-postgres-data
  knowledge-opc-redis-data:
    name: knowledge-opc-redis-data
  knowledge-opc-minio-data:
    name: knowledge-opc-minio-data
  knowledge-opc-milvus-data:
    name: knowledge-opc-milvus-data
  knowledge-opc-etcd-data:
    name: knowledge-opc-etcd-data
  knowledge-opc-app-files:
    name: knowledge-opc-app-files
  knowledge-opc-docreader-tmp:
    name: knowledge-opc-docreader-tmp

services:
  # ----------------------------------------------------------------------------
  # 1. 关系型数据库 (PostgreSQL 16)
  # ----------------------------------------------------------------------------
  knowledge-opc-postgres:
    image: postgres:16-alpine
    container_name: knowledge-opc-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-weknora_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-SetYourStrongDatabasePassword2026!}
      POSTGRES_DB: ${DB_NAME:-weknora_production}
      TZ: Asia/Shanghai
    volumes:
      - knowledge-opc-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-weknora_admin} -d ${DB_NAME:-weknora_production}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - knowledge-opc-network

  # ----------------------------------------------------------------------------
  # 2. 分布式缓存与队列 (Redis 7)
  # ----------------------------------------------------------------------------
  knowledge-opc-redis:
    image: redis:7-alpine
    container_name: knowledge-opc-redis
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-SetYourStrongRedisPassword2026!}"]
    volumes:
      - knowledge-opc-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-SetYourStrongRedisPassword2026!}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - knowledge-opc-network

  # ----------------------------------------------------------------------------
  # 3. 对象存储服务 (MinIO)
  # ----------------------------------------------------------------------------
  knowledge-opc-minio:
    image: quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z
    container_name: knowledge-opc-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY_ID:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_ACCESS_KEY:-SetYourStrongMinioSecretKey2026!}
    volumes:
      - knowledge-opc-minio-data:/data
    networks:
      - knowledge-opc-network

  # ----------------------------------------------------------------------------
  # 4. 向量数据库元数据存储 (etcd - Milvus 依赖)
  # ----------------------------------------------------------------------------
  knowledge-opc-etcd:
    image: registry.k8s.io/etcd:3.6.8-0
    container_name: knowledge-opc-etcd
    restart: always
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - knowledge-opc-etcd-data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir=/etcd
    networks:
      - knowledge-opc-network

  # ----------------------------------------------------------------------------
  # 5. 向量检索数据库 (Milvus Standalone)
  # ----------------------------------------------------------------------------
  knowledge-opc-milvus:
    image: milvusdb/milvus:v2.4.17
    container_name: knowledge-opc-milvus
    restart: always
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: knowledge-opc-etcd:2379
      MINIO_ADDRESS: knowledge-opc-minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY_ID:-minio_admin}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_SECRET_ACCESS_KEY:-SetYourStrongMinioSecretKey2026!}
    volumes:
      - knowledge-opc-milvus-data:/var/lib/milvus
    depends_on:
      - knowledge-opc-etcd
      - knowledge-opc-minio
    networks:
      - knowledge-opc-network

  # ----------------------------------------------------------------------------
  # 6. 文档深度解析微服务 (Docreader)
  # ----------------------------------------------------------------------------
  knowledge-opc-docreader:
    image: wechatopenai/weknora-docreader:latest
    container_name: knowledge-opc-docreader
    restart: always
    volumes:
      - knowledge-opc-docreader-tmp:/tmp/docreader
    networks:
      - knowledge-opc-network

  # ----------------------------------------------------------------------------
  # 7. 主后端核心服务 (App)
  #    线上构建镜像: knowledge-opc-app:<COMMIT_ID>
  # ----------------------------------------------------------------------------
  knowledge-opc-app:
    image: knowledge-opc-app:${KNOWLEDGE_OPC_VERSION:-latest}
    container_name: knowledge-opc-app
    restart: always
    env_file:
      - .env.production
    ports:
      - "${KNOWLEDGE_OPC_APP_PORT:-8080}:8080"
    volumes:
      - knowledge-opc-app-files:/data/files
      - knowledge-opc-docreader-tmp:/tmp/docreader:ro
      - ./config.yaml:/app/config/config.yaml:ro
    depends_on:
      knowledge-opc-postgres:
        condition: service_healthy
      knowledge-opc-redis:
        condition: service_healthy
      knowledge-opc-minio:
        condition: service_started
      knowledge-opc-milvus:
        condition: service_started
      knowledge-opc-docreader:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - knowledge-opc-network

  # ----------------------------------------------------------------------------
  # 8. 前端 UI 界面 (Nginx 代理与静态托管)
  #    线上构建镜像: knowledge-opc-ui:<COMMIT_ID>
  # ----------------------------------------------------------------------------
  knowledge-opc-ui:
    image: knowledge-opc-ui:${KNOWLEDGE_OPC_VERSION:-latest}
    container_name: knowledge-opc-ui
    restart: always
    ports:
      - "${KNOWLEDGE_OPC_UI_PORT:-80}:80"
    environment:
      - APP_HOST=knowledge-opc-app
      - APP_PORT=8080
      - APP_SCHEME=http
      - MAX_FILE_SIZE_MB=50
    depends_on:
      knowledge-opc-app:
        condition: service_healthy
    networks:
      - knowledge-opc-network
